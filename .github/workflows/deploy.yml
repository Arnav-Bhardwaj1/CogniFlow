name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# These env vars are available to ALL jobs below
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  # JOB 1: Runs ONLY on pull requests — creates a preview deployment
  deploy-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: 'npm' }
      - run: npm ci
      - run: npm i -g vercel                                                              # install Vercel CLI
      - run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}   # pull project settings
      - run: vercel build --token=${{ secrets.VERCEL_TOKEN }}                              # build locally
      - run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}                  # deploy the preview

  # JOB 2: Runs ONLY on push to main — deploys to production
  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: 'npm' }
      - run: npm ci
      - run: npm i -g vercel
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
